# mall-web 容器内 nginx 配置
# 该容器只负责承载前端静态资源；真正的入口/反向代理由已部署的 nginx 承担，
# 两者通过同一个 docker 网络互联，使用容器名访问。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 开启 gzip 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/vnd.ms-fontobject application/x-font-ttf font/opentype;

    # 带 hash 的构建产物（/assets/*）长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退：前端路由由 history 模式接管，找不到文件回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 如果需要由本容器反向代理后端网关，取消下面注释并替换上游地址。
    # 通常建议继续交给外层 nginx 处理 /api，本容器仅做静态托管。
    # location /api/ {
    #     proxy_pass http://backend-gateway:88;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
